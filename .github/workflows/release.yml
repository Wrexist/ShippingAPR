name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Publish
        run: >
          dotnet publish src/ShippingAPR.App/ShippingAPR.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          --output ./publish

      - name: Build installer
        run: |
          $version = "${{ env.RELEASE_VERSION }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=$version installer\setup.iss
        shell: pwsh

      - name: Copy installer to repo root
        run: Copy-Item ./installer-output/ShippingAPR-Setup.exe ./ShippingAPR-Setup.exe
        shell: pwsh

      - name: Commit installer to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ShippingAPR-Setup.exe
          git commit -m "Update ShippingAPR-Setup.exe to ${{ env.RELEASE_VERSION }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
        shell: pwsh

      - name: Create portable zip
        run: Compress-Archive -Path ./publish/* -DestinationPath ./ShippingAPR-${{ env.RELEASE_VERSION }}-portable-win-x64.zip
        shell: pwsh

      - name: Create and push tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ env.RELEASE_VERSION }}"
          git push origin "${{ env.RELEASE_VERSION }}"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            installer-output/ShippingAPR-Setup.exe
            ShippingAPR-${{ env.RELEASE_VERSION }}-portable-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_VERSION, '-beta') || contains(env.RELEASE_VERSION, '-rc') }}
          body: |
            ## Install

            **Easiest:** [Download the repo ZIP](https://github.com/Wrexist/ShippingAPR/archive/refs/heads/claude/ship-tracking-app-qdNAb.zip), extract it, and double-click `ShippingAPR-Setup.exe`.

            **Direct download:** Download `ShippingAPR-Setup.exe` from the assets below.

            **Portable:** Download the `.zip` file, extract anywhere, and run `ShippingAPR.exe`.

            No .NET installation required — everything is included. Requires Windows 10 or later (64-bit).

            > Windows SmartScreen may show a warning on first run since the app is not code-signed. Click **More info** → **Run anyway**.
