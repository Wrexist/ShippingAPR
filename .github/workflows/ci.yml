name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF (net8.0-windows) requires a Windows runner to build the full solution.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ShippingAPR.sln

      - name: Build
        # TreatWarningsAsErrors is enforced solution-wide via Directory.Build.props.
        run: dotnet build ShippingAPR.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ShippingAPR.sln --configuration Release --no-build --verbosity normal
